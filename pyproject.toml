[build-system]
requires = ["setuptools==81.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cptc-guarded-harness"
version = "0.1.0a5"
description = "Local deterministic CPTC workflows with bounded AI capabilities and UTC audit trails"
readme = "docs/harness/README.md"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.1"]

[project.optional-dependencies]
browser = ["playwright==1.62.0"]
mcp = ["mcp==1.29.0"]
test = ["pytest==9.1.0"]
benchmark = ["tiktoken==0.12.0"]
portcast-runtime = [
  "paramiko==5.0.0", "cryptography==50.0.1", "cffi==2.1.1",
  "pycparser==3.0", "bcrypt==5.0.0", "PyNaCl==1.6.2",
  "invoke==3.0.3", "fluidity-sm==0.2.1", "lexicon==3.0.0",
  "PyYAML==6.0.3",
]

[project.scripts]
cptc = "cptc_harness.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["cptc_harness*"]

[tool.setuptools.package-data]
cptc_harness = [
  "resources/CPTC-RULES-2025-10.txt", "resources/MANUAL-ONLY-CARDS.md",
  "resources/release-integrity.json", "resources/tool-catalog.json",
  "resources/portcast-python-runtime-v1.json",
  "resources/scanner-profiles-v1.json", "resources/scanner-profiles-v2.json",
  "resources/host-profiles-v1.json", "resources/bounded-profiles-v1.json",
  "profiles/common_mysql/catalog.json", "profiles/common_tls/catalog.json",
  "resources/zap-passive.yaml", "resources/nuclei/csp.yaml",
  "resources/nuclei/frame-options.yaml", "resources/nuclei/nosniff.yaml",
  "resources/nuclei/processed.yaml", "native/build-nmap-shim.sh",
  "native/nmap_connect_shim.c",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
