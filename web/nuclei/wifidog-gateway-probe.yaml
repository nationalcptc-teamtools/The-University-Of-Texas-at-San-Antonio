# wifidog-gateway captive portal detection.
id: wifidog-gateway-probe

info:
  name: wifidog-gateway Captive Portal Exposed
  author: cptc-toolkit
  severity: medium
  metadata:
    max-request: 1
    kind: detection
  description: |
    wifidog-gateway is the classic open-source captive portal gateway on
    ports 2050/2060. Its gateway on 2060 serves the login redirect surface
    that hands clients to the central auth server, and its parameters
    (gw_address, gw_port, gw_id) disclose the internal gateway layout.

    This template requests the portal root and matches the wifidog redirect
    parameter pattern. A match means a guest Wi-Fi gateway is directly
    reachable: the redirect parameters name the internal auth server and
    gateway ID which frame the rest of the Wi-Fi attack path.

    One GET request, read-only.
  reference:
    - https://github.com/wifidog/wifidog-gateway
  tags: wifi,captive-portal,wifidog,detection

http:
  - method: GET
    path:
      - "{{BaseURL}}/login/?gw_address={{InternalIP}}&gw_port=2060&gw_id=test"
    redirects: false
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Location"
      - type: dsl
        dsl:
          - "contains(to_lower(header), 'gw_') || contains(body, 'wifidog')"
